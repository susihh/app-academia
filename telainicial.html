<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia PowerFit</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
      /* Removido o padding-bottom global para não criar barra preta no final da landing page */
    }

    :root {
      --primary-orange: #ff6600;
      --hover-orange: #ff6600;
      --bg-dark: #050505;
      --card-bg: #0f0f0f;
      --text-gray: #a0a0a0;
      --error-red: #ff4d4d;
    }

    /* Animação de Fundo Flutuante */
    @keyframes pulseGlow {
      0% { 
        background-position: 0% 50%;
        background-size: 180% 180%;
      }
      50% { 
        background-position: 100% 50%;
        background-size: 240% 240%;
      }
      100% { 
        background-position: 0% 50%;
        background-size: 180% 180%;
      }
    }

    /* Cabeçalho */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background-color: rgba(5, 5, 5, 0.9);
      backdrop-filter: blur(10px);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 102, 0, 0.3);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--primary-orange);
    }

    /* Hero Section Animado */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 180px 8% 80px;
      background: radial-gradient(circle at 50% 50%, rgba(255, 102, 0, 0.55) 0%, rgba(255, 102, 0, 0.2) 40%, transparent 75%);
      background-size: 200% 200%;
      animation: pulseGlow 6s ease-in-out infinite;
    }

    .hero-text h1 {
      font-size: 3.5rem;
      line-height: 1.2;
      margin-bottom: 20px;
      animation: fadeInDown 1s ease forwards;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .hero-text h1 span {
      color: var(--primary-orange);
      text-shadow: 0 0 15px rgba(255, 102, 0, 0.6);
    }

    .hero-text p {
      color: #e0e0e0;
      font-size: 1.2rem;
      max-width: 700px;
      margin: 0 auto;
      animation: fadeInUp 1s ease 0.3s forwards;
      opacity: 0;
      text-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
    }

    /* Seção Como Funciona */
    .how-it-works {
      padding: 60px 8%;
      background-color: var(--bg-dark);
      text-align: center;
    }

    .section-title {
      font-size: 2.2rem;
      margin-bottom: 40px;
    }

    .section-title span {
      color: var(--primary-orange);
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      margin-bottom: 40px;
    }

    .step-card {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border-top: 4px solid var(--primary-orange);
      text-align: left;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .step-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 10px 25px rgba(255, 102, 0, 0.35);
    }

    .step-number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary-orange);
      margin-bottom: 15px;
      transition: transform 0.3s ease;
    }

    .step-card:hover .step-number {
      transform: scale(1.1);
    }

    .step-card h4 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .step-card p {
      color: var(--text-gray);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Seção do Cadastro ajustada sem a barra sobrando embaixo */
    .cta-section {
      padding: 40px 8% 60px;
      display: flex;
      justify-content: center;
      background-color: var(--bg-dark);
    }

    .cta-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 102, 0, 0.4);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-align: center;
      max-width: 500px;
      width: 100%;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .cta-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary-orange);
      box-shadow: 0 12px 35px rgba(255, 102, 0, 0.35);
    }

    .cta-card h3 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .cta-card p {
      color: var(--text-gray);
      font-size: 1rem;
      margin-bottom: 24px;
    }

    /* Botão com Pulso Contínuo */
    @keyframes pulseBtn {
      0% { box-shadow: 0 0 0 0 rgba(255, 102, 0, 0.6); }
      70% { box-shadow: 0 0 0 15px rgba(255, 102, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 102, 0, 0); }
    }

    .btn-orange {
      background-color: var(--primary-orange);
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.3s ease, transform 0.2s ease;
      animation: pulseBtn 2s infinite;
    }

    .btn-orange:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    /* Animações de Entrada (Scroll Reveal) */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s ease-out;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Modal Flutuante */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 16px;
      width: 90%;
      max-width: 450px;
      border: 1px solid var(--primary-orange);
      position: relative;
      transform: scale(0.7);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      cursor: pointer;
      transition: transform 0.2s, color 0.2s;
    }

    .close-btn:hover {
      transform: rotate(90deg);
      color: var(--primary-orange);
    }

    .modal-content h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .modal-content h2 span {
      color: var(--primary-orange);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #222;
      background-color: #000000;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary-orange);
    }

    /* Keyframes Gerais */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================
       ÁREA DO ALUNO & NAVEGAÇÃO DE PÁGINAS
    ========================================== */
    #main-screen {
      display: none;
      min-height: 100vh;
      padding: 110px 8% 100px;
      animation: fadeInUp 0.6s ease forwards;
    }

    .dashboard-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .tab-page {
      display: none;
    }

    .tab-page.active {
      display: block;
      animation: fadeInUp 0.4s ease forwards;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .dash-card {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 102, 0, 0.3);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      transition: border-color 0.3s ease, transform 0.3s ease;
    }

    .dash-card:hover {
      border-color: var(--primary-orange);
      transform: translateY(-5px);
    }

    .dash-card h3 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dash-card h3 span {
      color: var(--primary-orange);
    }

    /* Estilos do Bloco de Frequência */
    .freq-box {
      text-align: center;
      padding: 10px 0;
    }

    .freq-number {
      font-size: 3.2rem;
      font-weight: 800;
      color: var(--primary-orange);
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(255, 102, 0, 0.4);
    }

    .progress-bar-container {
      width: 100%;
      height: 14px;
      background-color: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid #333;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff8800, var(--primary-orange));
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .week-days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .day-btn {
      background-color: #000;
      border: 1px solid #333;
      color: var(--text-gray);
      padding: 10px 4px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      user-select: none;
    }

    .day-btn .day-name {
      font-size: 0.75rem;
      font-weight: 600;
    }

    .day-btn .check-icon {
      font-size: 0.9rem;
      opacity: 0.3;
    }

    .day-btn.active {
      border-color: var(--primary-orange);
      background-color: rgba(255, 102, 0, 0.15);
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 102, 0, 0.2);
    }

    .day-btn.active .check-icon {
      color: var(--primary-orange);
      opacity: 1;
    }

    .reset-week-btn {
      background: none;
      border: 1px solid #333;
      color: var(--text-gray);
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .reset-week-btn:hover {
      border-color: var(--primary-orange);
      color: var(--primary-orange);
    }

    .freq-info {
      color: var(--text-gray);
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    /* Estilos do Bloco de Peso Atual / Avaliação Mensal */
    .weight-display {
      font-size: 3rem;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      margin: 10px 0;
    }

    .weight-display span {
      font-size: 1.5rem;
      color: var(--primary-orange);
    }

    .weight-input-box {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

      flex: 1;
